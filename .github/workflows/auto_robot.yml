name: 🤖 Robô Radar Ninja

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada 1 hora
  workflow_dispatch: # Permite execução manual

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: |
          pip install requests

      - name: 🤖 Executar Ciclo de Automação
        run: |
          python scripts/auto_robot.py

      - name: 🚀 Publicar Mudanças
        run: |
          git config --global user.name "Radar Ninja Bot"
          git config --global user.email "bot@radarninja.com"
          git add -A
          git commit -m "🤖 AUTO: Atualização de ofertas, blog e sitemap [$(date +'%d/%m/%Y %H:%M')]" || exit 0
          git push
