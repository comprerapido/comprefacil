<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada — Compre Rápido</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
    <style>
        .error-page { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px 20px; }
        .error-code { font-size: 8rem; font-weight: 900; color: var(--accent); line-height: 1; margin-bottom: 20px; }
        .error-title { font-size: 2rem; font-weight: 800; margin-bottom: 16px; }
        .error-desc { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 32px; max-width: 500px; }
        .error-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .btn-home { background: var(--primary); color: white; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: 700; transition: background 0.2s; }
        .btn-home:hover { background: var(--primary-dark); }
        .btn-offers { background: var(--accent); color: white; padding: 14px 28px; border-radius: 10px; text-decoration: none; font-weight: 700; transition: background 0.2s; }
        .btn-offers:hover { background: var(--accent-dark); }
    </style>
</head>
<body>
<header class="header">
    <div class="container">
        <a href="/" class="logo"><div class="logo-icon">⚡</div>Compre<span>Rápido</span></a>
        <button class="menu-toggle" aria-label="Menu">☰</button>
        <nav class="nav-links">
            <a href="/ofertas-hoje/">⚡ Achados</a>
            <a href="/categorias/">📦 Categorias</a>
            <a href="/melhores-2026/">🏆 Top 2026</a>
            <a href="/guias/">📖 Guias</a>
        </nav>
    </div>
</header>
<main>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Ops! Essa página sumiu.</h1>
            <p class="error-desc">A página que você está procurando não existe ou foi movida. Mas temos muitas ofertas esperando por você!</p>
            <div class="error-actions">
                <a href="/" class="btn-home">Voltar ao Início</a>
                <a href="/ofertas-hoje/" class="btn-offers">⚡ Ver Achados do Dia</a>
            </div>
        </div>
    </div>
</main>
<footer class="footer">
    <div class="container">
        <div class="footer-bottom" style="border-top: none; padding-top: 0;">
            © 2026 Compre Rápido — Encontre Rápido. Compre Melhor.
        </div>
    </div>
</footer>
</body>
</html>
