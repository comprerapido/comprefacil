<!DOCTYPE html>
<html lang="pt-BR">

    <style>
        .cat-header { background: #0f172a; color: white; padding: 60px 0; text-align: center; }
        .cat-header h1 { font-size: 48px; font-weight: 900; }
        .product-card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; position: relative; }
        .badge { position: absolute; top: 15px; right: 15px; background: #dcfce7; color: #166534; padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .product-img { height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .product-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .btn { display: block; background: #28a745; color: white; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <header style="background: white; padding: 20px 0; border-bottom: 1px solid #e2e8f0;">
